name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: marketplace_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dev"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo typecheck
      - run: pnpm turbo lint
      - run: pnpm turbo test
        env:
          DATABASE_URL: postgresql://dev:dev@localhost:5432/marketplace_test?schema=public
          REDIS_URL: redis://localhost:6379
      - run: pnpm turbo build
      - run: pnpm --filter api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://dev:dev@localhost:5432/marketplace_test?schema=public
      - run: pnpm --filter api run test:e2e
        env:
          DATABASE_URL: postgresql://dev:dev@localhost:5432/marketplace_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ci-test-jwt-access-secret-12345
          JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-12345
          RAZORPAY_WEBHOOK_SECRET: ci-test-razorpay-webhook-secret
          SHIPROCKET_WEBHOOK_TOKEN: ci-test-shiprocket-webhook-token
          RAZORPAY_KEY_ID: rzp_test_ci_mock_key
          RAZORPAY_KEY_SECRET: rzp_test_ci_mock_secret
          MEILI_MASTER_KEY: dev-master-key
          SMTP_HOST: localhost
          SMTP_PORT: 1025
